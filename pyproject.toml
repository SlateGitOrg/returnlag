[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "returnlag"
version = "0.1.0"
description = "Return rates by shipment cohort, completed with chain-ladder and Bornhuetter-Ferguson in DuckDB SQL and backtested."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "returnlag contributors" }]
keywords = ["sql-analysis", "reverse-logistics", "returns", "duckdb", "cohort-analysis"]
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
]

[project.scripts]
returnlag = "returnlag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/returnlag"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "returnlag/sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
